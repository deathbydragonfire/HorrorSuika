<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body, #unity-container, #unity-canvas {
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        margin: 0;
        padding: 0;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0d0d11;
      }
      #unity-container {
        position: absolute;
        left: env(safe-area-inset-left, 0px);
        right: env(safe-area-inset-right, 0px);
        top: env(safe-area-inset-top, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: {{{ BACKGROUND_COLOR_STYLE }}};
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 60%;
        max-width: 480px;
        display: none;
      }
      #unity-progress-bar-empty {
        width: 100%;
        height: 12px;
        background: #22222a;
        border-radius: 6px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #e0e0e6;
      }
      #unity-warning {
        position: absolute;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        display: block;
      }
      #unity-warning > div {
        background: #ffffffe6;
        color: #111;
        padding: 10px;
        margin: 4px;
        border-radius: 6px;
        font: 14px/1.4 sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Kill the Android long-press context menu, which otherwise interrupts a drag.
      canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });

      // itch.io embeds the game in an iframe. A click must focus the canvas or keyboard
      // input never arrives, and Space / arrows otherwise scroll the parent page.
      function focusCanvas() { canvas.focus(); }
      canvas.addEventListener("pointerdown", focusCanvas);
      canvas.addEventListener("touchstart", focusCanvas, { passive: true });
      var blockPageKeys = { Space: 1, ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1 };
      window.addEventListener("keydown", function (event) {
        if (blockPageKeys[event.code]) {
          event.preventDefault();
        }
      });

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") {
          div.style.background = "#ff9a9a";
        } else if (type == "warning") {
          div.style.background = "#ffffa5";
        }
        if (type != "error") {
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
        // Cap retina and phone canvases. The flesh raymarch fills every covered pixel,
        // and a 3x itch embed will lose the WebGL context.
        devicePixelRatio: (window.matchMedia && window.matchMedia("(pointer: coarse)").matches)
          ? Math.min(window.devicePixelRatio || 1, 1.25)
          : Math.min(window.devicePixelRatio || 1, 2)
      };

      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          progressBarFull.style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          loadingBar.style.display = "none";
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
